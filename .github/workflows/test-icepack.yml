name: GHActions

# This workflow is triggered on pushes, pull-requeust, and releases
# ghactions* branch names will trigger this to support development testing
# The steps are shared with CICE through the composite actions in .github/actions

on:
  push:
    branches:
      - main
      - 'Icepack*'
      - 'ghactions*'
  pull_request:
  release:
    types:
      - created

# Establish a secure, read-only baseline for the repository token
permissions:
  contents: read

defaults:
  run:
    shell: /bin/csh -e {0}

jobs:
  build:
    name: "IcepackTesting"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false   # <-- Keeps other matrix jobs running if one fails
      matrix:
        os: [macos-latest, ubuntu-latest, macos-15]
        include:
          - os: macos-latest
            envdef: macos
            testid: M00
            testsuites: "quick_suite"
            experimental: true
          - os: macos-15
            envdef: macos
            testid: M15
            testsuites: "travis_suite,io_suite"
            experimental: false
          - os: ubuntu-latest
            envdef: linux
            testid: L00
            testsuites: "travis_suite,io_suite"
            experimental: false
    steps:
      - name: clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
      - name: check for tabs
        uses: ./.github/actions/check-tabs
        with:
          paths: columnphysics configuration/driver
      - name: setup conda env
        uses: ./.github/actions/setup-env
        with:
          model: icepack
      - name: download input data
        uses: ./.github/actions/get-input-data
        with:
          model: icepack
          files: |
            https://zenodo.org/records/3728287/files/Icepack_data-20200326.tar.gz eb706ec09d4d35d6da3a118c8cba79d7d727e3d6aed19568e24423b92d3ea6bc
      - name: run suite
        uses: ./.github/actions/run-suite
        with:
          model: icepack
          envdef: ${{ matrix.envdef }}
          testsuites: ${{ matrix.testsuites }}
          testid: ${{ matrix.testid }}
